<!DOCTYPE html>
<html lang="Español">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Iconos y demas -->
    <title>Feliz Cumpleaños</title>
    <link rel="icon" href= "Imagenes/PastelIcono.ico" type="image/x-icon">
    <link rel="stylesheet" href="HappyBirthday.css" />


</head>
<body>
    <div id="pantalla-carga">
      <img id="img-carga" src="Imagenes/Personaje/Carga.jpg" />
    </div>

    <!--  El control que tomara las medidas  -->
    <div id="contenedorprincipal">
        <!--  Imagen de snoopy  -->
        <img id="llamada" src="Imagenes/Personaje/Made02.png"/>


        <div class="contenedor">

           <!--  El control para el telefono  -->
          <div id="ingresar-fecha">
            <h2>Ingresar fecha:</h2>
            <input type="text" id="pantalla" placeholder="DD/MM/AAAA" readonly />
          </div>

            <div class="grid-botones">
              <button class="Numeros">1</button>

              <button class="Numeros">2</button>

              <button class="Numeros">3</button>

              <button class="Numeros">4</button>

              <button class="Numeros">5</button>

              <button class="Numeros">6</button>

              <button class="Numeros">7</button>

              <button class="Numeros">8</button>

              <button class="Numeros">9</button>

              <button class="Numeros">0</button>

             <div class="fila-enter">
                <button class="enter">Enter</button>
                <button class="borrar">🗑</button>
             </div>
            </div>
        </div>
    </div>

    <script src="HappyBirthday.js"></script>

</body>
</html>
